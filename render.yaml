# Inställningar för Render
services:
  - type: web
    name: syncup
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /status
    envVars:
      - key: NODE_VERSION
        value: "22"
      # adminnyckeln, syns under Environment på Render
      - key: ADMIN_KEY
        generateValue: true
